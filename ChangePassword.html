<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Muslim</title>
    <link rel="stylesheet" href="css/ChangePassword.css">
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        
        <div class="form-section">
            <h1 class="form-title">Change Password</h1>
            <p class="form-subtitle">Please enter a new secure password to protect your account!</p>
            
            <form id="changePasswordForm">
                <div class="input-group">
                    <label>Password*</label>
                    <div class="input-wrapper">
                        <img src="image/password.svg" class="field-icon">
                        <input type="password" id="newPass" placeholder="Enter new password" required>
                        <img src="image/eye.svg" class="eye-icon" onclick="togglePass('newPass')">
                    </div>
                    <small class="hint">Must be at least 8 characters and include letters and numbers</small>
                </div>

                <div class="input-group">
                    <label>Confirm Password*</label>
                    <div class="input-wrapper">
                        <img src="image/password.svg" class="field-icon">
                        <input type="password" id="confirmPass" placeholder="Re-enter your password" required>
                        <img src="image/eye.svg" class="eye-icon" onclick="togglePass('confirmPass')">
                    </div>
                    <small class="hint">Must match the new password</small>
                </div>

                <button type="submit" class="btn-primary"> <a href="pass.html">Update Password</a></button>

                <p class="security-note">For your security, do not share your password with anyone</p>
            </form>
        </div>

      <!-- القسم اليمين -->
        <div class="brand-section">

            <div class="brand-header">
                <img src="image/logo.svg" class="logo">
                <img src="image/Where new hearts find guidance and warmth.svg" class="slogan">
            </div>

            <div class="hero-scene">
                 <div class="bottom-shape">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 415" fill="none">
                      <path d="M90.9318 266C-0.268211 291.6 -5.73488 380.667 2.93179 422H606.932V0H571.342C523.061 0 485.698 40.3228 462.565 82.7016C393.976 208.353 186.701 239.117 90.9318 266Z" fill="#CBC5AF"/>
                      </svg>
                 </div>
           <img src="image/ظل.png" class="shadow">
           <img src="image/changepass.png" class="hero-character">

</div>

        </div>

    </div>
</div>

<script>
    function togglePass(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }
</script>
</body>
